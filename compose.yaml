name: kopo-course-finder

services:
  app:
    platform: linux/amd64
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11.14-slim-bookworm

        ENV PYTHONDONTWRITEBYTECODE=1 \
            PYTHONUNBUFFERED=1 \
            PYTHONUTF8=1 \
            PIP_DISABLE_PIP_VERSION_CHECK=1

        RUN apt-get update \
            && apt-get install -y --no-install-recommends \
                build-essential ca-certificates git libgomp1 \
            && rm -rf /var/lib/apt/lists/* \
            && useradd --create-home --uid 1000 --shell /bin/bash app \
            && mkdir -p /workspace /home/app/.cache/huggingface \
            && chown -R app:app /workspace /home/app/.cache

        WORKDIR /workspace
        COPY requirements.txt /tmp/requirements.txt
        RUN --mount=type=cache,target=/root/.cache/pip \
            python -m pip install -r /tmp/requirements.txt \
            && python -m pip check

        USER app
        EXPOSE 7860

    init: true
    working_dir: /workspace
    # Keep the development environment running until app.py is implemented.
    command: ["sleep", "infinity"]
    ports:
      - "127.0.0.1:${APP_PORT:-7860}:7860"
    volumes:
      - type: bind
        source: .
        target: /workspace
      - huggingface-cache:/home/app/.cache/huggingface
    environment:
      PYTHONPATH: /workspace/src
      HF_HOME: /home/app/.cache/huggingface
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      HF_HUB_DISABLE_TELEMETRY: "1"
      GRADIO_ANALYTICS_ENABLED: "False"
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: "7860"
      COURSE_DB_PATH: ${COURSE_DB_PATH:-data/courses.sqlite3}
      BASE_MODEL_ID: ${BASE_MODEL_ID:-unsloth/Meta-Llama-3.1-8B-Instruct-bnb-4bit}
      BASE_MODEL_REVISION: ${BASE_MODEL_REVISION:-f15c379fb32bb402fa06a7ae9aecb1febf4b79ec}
      SQL_ADAPTER_ID: ${SQL_ADAPTER_ID:-huggingface-KREW/Llama-3.1-8B-Spider-SQL-Ko}
      SQL_ADAPTER_REVISION: ${SQL_ADAPTER_REVISION:-11d1e533ccbe48c9135baeba83a16205ca4ca251}
      MODEL_COMPUTE_DTYPE: ${MODEL_COMPUTE_DTYPE:-float16}
      MODEL_MAX_INPUT_TOKENS: ${MODEL_MAX_INPUT_TOKENS:-2048}
      MODEL_MAX_NEW_TOKENS: ${MODEL_MAX_NEW_TOKENS:-256}
      MODEL_MAX_SECONDS: ${MODEL_MAX_SECONDS:-60}
      MAX_RESULT_ROWS: ${MAX_RESULT_ROWS:-200}
      SQL_TIMEOUT_SECONDS: ${SQL_TIMEOUT_SECONDS:-5}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    shm_size: 2gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  huggingface-cache:
